# Local deterministic mock only. These prices are fixtures, not real provider quotes.
model_list:
  - model_name: tiny-selector
    deployment_id: tiny
    deltallm_params:
      model: openai/tiny
      api_key: local-mock-only
      api_base: http://independent-selector-mock:8000/v1
    model_info:
      mode: chat
      max_tokens: 8192
      chat_capabilities: {}
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      rpm_limit: 10000
      tpm_limit: 100000000
  - model_name: economy-answer
    deployment_id: economy
    deltallm_params:
      model: openai/economy
      api_key: local-mock-only
      api_base: http://independent-selector-mock:8000/v1
    model_info:
      mode: chat
      max_tokens: 131072
      chat_capabilities: {streaming: true, tools: true}
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      rpm_limit: 10000
      tpm_limit: 100000000
  - model_name: quality-answer
    deployment_id: quality
    deltallm_params:
      model: openai/quality
      api_key: local-mock-only
      api_base: http://independent-selector-mock:8000/v1
    model_info:
      mode: chat
      max_tokens: 131072
      chat_capabilities: {streaming: true, tools: true}
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00002
      rpm_limit: 10000
      tpm_limit: 100000000
router_settings:
  num_retries: 0
  timeout: 10
  route_groups:
    - key: independent-answers
      mode: chat
      strategy: priority-based-routing
      context: {mode: eligible-only, unknown_capacity: exclude}
      selector:
        kind: llm-tier
        classifier_deployment_id: tiny
        lanes:
          - {id: economy, rank: 0, description: Routine work}
          - {id: quality, rank: 1, description: Complex work}
      members:
        - {deployment_id: economy, lane: economy}
        - {deployment_id: quality, lane: quality}
general_settings:
  master_key: os.environ/DELTALLM_MASTER_KEY
  salt_key: os.environ/DELTALLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  redis_url: os.environ/REDIS_URL
  model_deployment_source: config_only
  cache_enabled: false
  spend_ingestion_mode: outbox
  spend_ingestion_worker_enabled: true
  audit_enabled: false
  organization_deletion_worker_enabled: false
  audit_retention_worker_enabled: false
