# Chart-rendered defaults for config.general_settings.
#
# Every value here equals the gateway's built-in default. The chart renders them
# explicitly into each role's ConfigMap so that an image upgrade cannot silently
# change capacity, timeout, or worker behaviour of a running release. Override any
# of them under config.general_settings in your values file; values there win.
# Reference for each setting: docs/configuration/general-settings-reference.md
