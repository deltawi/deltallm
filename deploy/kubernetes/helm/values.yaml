nameOverride: ""
fullnameOverride: ""

replicaCount: 2
revisionHistoryLimit: 10
minReadySeconds: 5
terminationGracePeriodSeconds: 90

managedLifecycle:
  enabled: true
  production: false
  exitMarginSeconds: 10

image:
  repository: deltallm/deltallm
  pullPolicy: IfNotPresent
  tag: latest
  digest: ""
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Router Redis keys moved from an unscoped schema to the v1 application and
# environment namespace. Upgrades from an unmarked legacy release must
# explicitly confirm that every old API and worker pod has been drained and
# stopped before Recreate starts v1 pods. Later v1 upgrades detect the marker.
routerStateSchemaCutover:
  enabled: true
  acknowledged: false

service:
  type: ClusterIP
  port: 4000
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

probes:
  startup:
    enabled: true
    path: /health/readiness
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5
  liveness:
    path: /health/liveliness
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    successThreshold: 2
    path: /health/readiness
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  admittedInflight:
    enabled: false
    targetAverageValue: 70
  scaleDownStabilizationSeconds: 300
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingress: []
  egress: []
  allowDns: true

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

command: []
args: []
env: []
envFrom: []
extraVolumes: []
extraVolumeMounts: []

api:
  # Per-role config overrides for the API/UI/gateway Deployment.
  # When batchWorker.enabled=true, Helm automatically disables batch
  # background loops for API pods unless explicitly overridden here.
  config: {}

batchWorker:
  enabled: false
  # Local batch artifact storage is unsafe when API and worker run in separate pods.
  # Set only for single-node/dev split-mode experiments.
  allowUnsafeLocalStorage: false
  replicaCount: 1
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  command: []
  args: []
  env: []
  envFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  service:
    enabled: true
    type: ClusterIP
    port: 4000
    annotations: {}
    labels: {}
  serviceMonitor:
    enabled: true
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    labels: {}
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    scaleDownStabilizationSeconds: 300
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Per-role config overrides for the batch worker Deployment.
  # Shared config.general_settings is used first, then worker-safe defaults
  # are filled for missing keys, then this map is applied last.
  config: {}

# Dedicated compatibility projection and expired-reservation recovery role.
# API pods retain reservation/finalization microbatchers but do not run this loop.
accountingWorker:
  enabled: false
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationSeconds: 300
    oldestEventAge:
      enabled: false
      metricName: deltallm_accounting_projection_oldest_event_age_seconds
      targetAverageValue: "5"
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  command: []
  args: []
  env: []
  envFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # This role does not serve gateway traffic. Keep its control/foreground pools
  # small while preserving dedicated admission and worker pools for projection.
  config:
    general_settings:
      db_pool_size: 4
      db_foreground_pool_size: 1
      telemetry_db_pool_size: 5
      telemetry_worker_db_pool_size: 5

# Native signed RPC role. Fixed replicas and rollout overlap count in capacity.
accountingRequest:
  enabled: false
  replicaCount: 1
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  command: []
  args: []
  env: []
  envFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  config: {}

dependencyWait:
  enabled: true
  timeoutSeconds: 180
  periodSeconds: 2

secret:
  existingSecret: ""
  keys:
    masterKey: master-key
    saltKey: salt-key
    batchWebhookEncryptionKey: batch-webhook-encryption-key
  values:
    masterKey: ""
    saltKey: ""
    # URL-safe base64 encoding of exactly 32 random bytes. Keep this stable
    # for as long as pending webhook deliveries may need to be decrypted.
    batchWebhookEncryptionKey: ""

runtime:
  accounting:
    existingSecret:
      name: ""
      signingKey: accounting-rpc-signing-secret
  database:
    url: ""
    existingSecret:
      name: ""
      urlKey: DATABASE_URL
  redis:
    url: ""
    existingSecret:
      name: ""
      urlKey: REDIS_URL

config:
  # Selector-enabled chat members require model_info.chat_capabilities and context limits.
  # Classifiers additionally require explicit provider prices and positive RPM/TPM limits.
  # Activate only with spend_ingestion_mode: outbox and its enabled worker; see router docs.
  model_list: []
  router_settings:
    routing_strategy: simple-shuffle
    num_retries: 3
    retry_after: 1
    timeout: 300
    cooldown_time: 60
    allowed_fails: 0
    enable_pre_call_checks: false
    model_group_alias: {}
  deltallm_settings:
    fallbacks: []
    context_window_fallbacks: []
    content_policy_fallbacks: []
    guardrails: []
    success_callback: []
    failure_callback: []
    callbacks: []
    callback_settings: {}
    turn_off_message_logging: false
  general_settings:
    # Opt-in manual OpenAI Realtime sessions; requires spend outbox + Redis.
    realtime:
      enabled: false
      default_transcription_model: null
      max_connections: 64
      global_max_connections: 256
      organization_max_connections: 64
      max_turns: 100
      max_output_tokens: 4096
      max_message_bytes: 1048576
      max_input_bytes: 67108864
      max_client_events: 10000
      max_server_events: 100000
      handshake_seconds: 10
      session_seconds: 300
      idle_seconds: 60
      write_seconds: 10
      health_seconds: 5
      cleanup_seconds: 5

    readiness_probe_timeout_seconds: 1
    readiness_cache_seconds: 1
    lifecycle_withdrawal_seconds: 5
    lifecycle_request_drain_seconds: 45
    lifecycle_cancellation_seconds: 5
    lifecycle_worker_drain_seconds: 20
    lifecycle_close_seconds: 5
    lifecycle_shutdown_seconds: 80
    migration_mode: startup
    deployment_capacity_path: null
    deployment_capacity_role: api
    migration_verify_timeout_seconds: 10
    # Finite Redis allocations (restart required).
    redis_bulk_url: null
    redis_critical_max_connections: 64
    redis_bulk_max_connections: 16
    redis_acquisition_timeout_seconds: 0.2
    redis_socket_timeout_seconds: 1.0
    redis_connect_timeout_seconds: 1.0
    deltallm_key_header_name: Authorization
    # Startup-only provider discovery egress; independent of batch webhook policy.
    provider_discovery_allow_http: false
    provider_discovery_allowed_ports: [443]
    provider_discovery_allowed_private_cidrs: []
    upstream_http_connect_timeout_seconds: 10
    upstream_http_read_timeout_seconds: 300
    upstream_http_write_timeout_seconds: 30
    upstream_http_pool_timeout_seconds: 10
    upstream_http_max_connections: 500
    upstream_http_max_keepalive_connections: 100
    upstream_http_keepalive_expiry_seconds: 60
    prompt_negative_cache_enabled: false
    prompt_cache_l1_ttl_seconds: 30
    prompt_cache_l2_ttl_seconds: 300
    prompt_negative_l1_ttl_seconds: 5
    prompt_negative_l2_ttl_seconds: 30
    prompt_cache_l1_max_entries: 10000
    prompt_singleflight_max_keys: 256
    prompt_singleflight_timeout_seconds: 2
    email_worker_batch_size: 10
    email_worker_delivery_lease_seconds: 60
    email_worker_audit_lease_seconds: 30
    email_worker_startup_timeout_seconds: 5
    email_worker_shutdown_drain_timeout_seconds: 20
    budget_enforcement_query_mode: legacy
    budget_enforcement_shadow_sample_rate: 0.01
    budget_enforcement_query_timeout_seconds: 2
    # Per-process ingress admission (restart required; enable after workload validation).
    gateway_ingress_control_max_active: 16
    gateway_ingress_control_max_buffered_bytes: 67108864
    auth_fallback_max_active: 8
    auth_fallback_max_waiters: 32
    auth_fallback_queue_timeout_ms: 10
    auth_fallback_timeout_seconds: 0.5
    auth_fallback_cache_timeout_seconds: 0.1
    auth_fallback_cache_max_bytes: 131072
    # Startup-only callback delivery and guardrail execution bounds.
    callback_max_pending: 128
    callback_max_concurrency: 4
    callback_max_payload_bytes: 262144
    callback_max_bytes: 8388608
    callback_timeout_seconds: 5
    callback_shutdown_seconds: 5
    guardrail_max_concurrency: 2
    guardrail_max_pending: 8
    guardrail_max_bytes: 33554432
    guardrail_timeout_seconds: 5
    guardrail_shutdown_seconds: 5
    gateway_ingress_enabled: false
    gateway_ingress_max_active: 100
    gateway_ingress_max_waiters: 0
    gateway_ingress_queue_timeout_ms: 10
    gateway_ingress_max_body_bytes: 33554432
    gateway_ingress_max_buffered_bytes: 67108864
    gateway_ingress_body_timeout_seconds: 10.0
    gateway_ingress_health_max_active: 4
    gateway_preflight_capacity_enabled: false
    gateway_preflight_global_max_parallel: 300
    gateway_preflight_org_max_parallel: 100
    gateway_preflight_lease_ttl_seconds: 30
    spend_ingestion_mode: legacy
    spend_operation_intents_enabled: false
    spend_settlement_db_pool_size: 1 # Reserved within telemetry_db_pool_size.
    spend_ingestion_batch_size: 100
    spend_ingestion_flush_interval_ms: 100
    spend_ingestion_lease_seconds: 30
    spend_ingestion_max_attempts: 10
    spend_ingestion_worker_enabled: true
    spend_ingestion_max_pending_events: 100000
    spend_ingestion_overload_policy: sync_fallback
    spend_ingestion_fallback_max_concurrency: 1
    spend_ingestion_fallback_max_waiters: 8
    spend_ingestion_fallback_queue_timeout_ms: 100
    spend_ingestion_fallback_execution_timeout_seconds: 2
    spend_ingestion_completed_retention_hours: 1
    spend_ingestion_failed_retention_days: 30
    spend_ingestion_cleanup_interval_seconds: 60
    spend_ingestion_cleanup_batch_size: 1000
    spend_ingestion_cleanup_max_batches_per_run: 10
    spend_ingestion_cleanup_time_budget_seconds: 2
    db_pool_size: 20
    db_pool_timeout: 30
    telemetry_db_pool_size: 5
    db_foreground_pool_size: 8
    telemetry_worker_db_pool_size: 5
    db_acquisition_timeout_seconds: 0.2
    db_statement_timeout_seconds: 1.0
    db_lock_timeout_seconds: 0.2
    db_transaction_timeout_seconds: 2.0
    db_background_statement_timeout_seconds: 5.0
    db_background_lock_timeout_seconds: 1.0
    db_background_transaction_timeout_seconds: 10.0
    redis_cache_max_connections: 16
    telemetry_db_pool_timeout_seconds: 2
    telemetry_worker_startup_timeout_seconds: 5
    telemetry_shutdown_drain_timeout_seconds: 20
    accounting_protocol_enabled: false
    accounting_execution_mode: assigned
    accounting_request_url: null
    accounting_rpc_signing_secret: null
    accounting_rpc_allow_http: false
    accounting_rpc_allowed_ports: [443]
    accounting_rpc_allowed_private_cidrs: []
    accounting_rpc_max_connections: 16
    accounting_local_max_subjects: 1024
    accounting_protocol_generation: 1
    accounting_microbatch_max_size: 8
    accounting_microbatch_dwell_ms: 2
    accounting_reservation_max_pending: 4096
    accounting_finalization_max_pending: 8192
    accounting_reservation_max_pending_bytes: 8388608
    accounting_finalization_max_pending_bytes: 8388608
    accounting_statement_timeout_ms: 250
    accounting_reservation_ack_timeout_ms: 1000
    accounting_finalization_ack_timeout_ms: 2000
    accounting_hot_path_db_pool_size: 2
    accounting_max_provider_attempts: 3
    accounting_grants_enabled: true
    accounting_grant_target_operations: 32
    accounting_grant_ttl_seconds: 30
    accounting_projection_worker_enabled: false
    accounting_projection_batch_size: 64
    accounting_projection_max_concurrent_partitions: 4
    accounting_projection_lease_seconds: 30
    accounting_projection_poll_interval_ms: 50
    accounting_projection_maintenance_interval_ms: 1000
    audit_ingestion_mode: legacy
    audit_ingestion_worker_enabled: true
    audit_ingestion_batch_size: 100
    audit_ingestion_flush_interval_ms: 100
    audit_ingestion_lease_seconds: 30
    audit_ingestion_max_attempts: 10
    audit_ingestion_max_pending_events: 100000
    audit_ingestion_required_reserve: 10000
    audit_ingestion_completed_retention_hours: 1
    audit_ingestion_failed_retention_days: 30
    audit_ingestion_cleanup_interval_seconds: 60
    audit_ingestion_cleanup_batch_size: 1000
    audit_ingestion_cleanup_max_batches_per_run: 10
    audit_ingestion_cleanup_time_budget_seconds: 2
    cache_enabled: false
    cache_backend: memory
    cache_ttl: 3600
    cache_max_size: 10000
    background_health_checks: true
    health_check_interval: 300
    health_check_model: gpt-3.5-turbo
    model_deployment_source: hybrid
    model_deployment_bootstrap_from_config: true
    organization_lifecycle_auth_max_staleness_seconds: 3
    organization_lifecycle_auth_cache_max_entries: 10000
    organization_deletion_recovery_window_hours: 168
    organization_deletion_max_attempts: 20
    organization_deletion_requests_enabled: false
    organization_deletion_worker_enabled: true
    organization_deletion_worker_poll_interval_seconds: 5
    organization_deletion_worker_batch_size: 5
    organization_deletion_worker_max_concurrency: 2
    organization_deletion_worker_lease_seconds: 60
    organization_deletion_worker_record_timeout_seconds: 45
    organization_deletion_worker_page_size: 100
    organization_deletion_worker_max_pages_per_claim: 10
    organization_deletion_waiting_poll_seconds: 10
    organization_deletion_retry_initial_seconds: 5
    organization_deletion_retry_max_seconds: 300
    cache_invalidation_worker_enabled: true
    cache_invalidation_worker_poll_interval_seconds: 5
    cache_invalidation_worker_batch_size: 25
    cache_invalidation_worker_max_concurrency: 4
    cache_invalidation_worker_lease_seconds: 60
    cache_invalidation_worker_record_timeout_seconds: 10
    cache_invalidation_max_attempts: 10
    cache_invalidation_retry_initial_seconds: 5
    cache_invalidation_retry_max_seconds: 300
    cache_invalidation_immediate_timeout_seconds: 0.5
    # Batch API defaults are safe for local/single-replica deployments.
    # If embeddings_batch_enabled is true and replicaCount > 1, configure
    # embeddings_batch_storage_backend: s3 so every pod can read/write artifacts.
    embeddings_batch_enabled: false
    embeddings_batch_worker_enabled: true
    embeddings_batch_completion_outbox_worker_enabled: true
    batch_webhook_enabled: false
    batch_webhook_worker_enabled: true
    batch_webhook_observability_enabled: true
    batch_webhook_poll_interval_seconds: 1
    batch_webhook_observability_refresh_interval_seconds: 15
    batch_webhook_max_concurrency: 4
    batch_webhook_lease_seconds: 30
    batch_webhook_timeout_seconds: 10
    batch_webhook_max_attempts: 8
    batch_webhook_retry_initial_seconds: 5
    batch_webhook_retry_max_seconds: 3600
    batch_webhook_allowed_ports:
      - 443
    batch_webhook_allowed_private_cidrs: []
    batch_webhook_allow_http: false
    batch_webhook_delivery_retention_days: 30
    batch_webhook_cleanup_max_rows_per_run: 10000
    embeddings_batch_storage_backend: local
    embeddings_batch_storage_dir: .deltallm/batch-artifacts
    embeddings_batch_create_session_cleanup_enabled: true
    embeddings_batch_gc_enabled: true
    # Phase 6 scheduler rollout controls. Leave commented to preserve legacy
    # boolean flag behavior; set explicitly to make this one field control
    # active scheduler behavior.
    # embeddings_batch_scheduler_mode: fifo_v1
    # embeddings_batch_scheduler_shadow_mode: none
    embeddings_batch_scheduler_shadow_decision_timeout_seconds: 0.5
    embeddings_batch_scheduler_shadow_max_pending_decisions: 16
    embeddings_batch_scheduler_enabled: false
    embeddings_batch_scheduler_shadow_enabled: false
    embeddings_batch_scheduler_strict_model_homogeneity_enabled: false
    embeddings_batch_scheduler_default_service_tier: standard
    embeddings_batch_scheduler_estimator_version: v1
    embeddings_batch_scheduler_backfill_enabled: false
    embeddings_batch_scheduler_backfill_interval_seconds: 60
    embeddings_batch_scheduler_backfill_scan_limit: 500
    embeddings_batch_stale_lease_sweeper_enabled: true
    embeddings_batch_stale_lease_sweeper_interval_seconds: 60
    embeddings_batch_stale_lease_sweeper_failure_interval_seconds: 30
    embeddings_batch_stale_lease_sweeper_page_size: 100
    embeddings_batch_stale_lease_sweeper_max_rows_per_run: 500
    embeddings_batch_scheduler_claim_mode: job_fifo
    embeddings_batch_advisory_lock_mode: dual
    embeddings_batch_work_claim_max_items: 0
    embeddings_batch_work_claim_max_work_units: 0
    embeddings_batch_work_claim_min_items_for_microbatch: 4
    embeddings_batch_model_capacity_enabled: false
    embeddings_batch_default_model_max_in_flight: 16
    embeddings_batch_default_model_max_claim_work_units: 64
    embeddings_batch_model_capacity_fraction: 0.25
    embeddings_batch_model_capacity_refresh_seconds: 5
    embeddings_batch_model_capacity_fail_open: false
    embeddings_batch_tenant_fair_share_enabled: false
    embeddings_batch_scheduler_base_quantum_work_units: 16
    embeddings_batch_scheduler_max_deficit_multiplier: 8
    embeddings_batch_tenant_max_in_flight_work_units: 0
    embeddings_batch_tenant_max_queued_work_units: 0
    embeddings_batch_scheduler_max_active_flows_per_decision: 100
    embeddings_batch_scheduler_max_candidate_jobs_per_flow: 50
    embeddings_batch_tenant_scope_preference: organization,team,api_key,user
    embeddings_batch_tenant_fair_share_disabled_model_groups: []
    embeddings_batch_size_aware_scheduling_enabled: false
    embeddings_batch_aging_seconds_per_work_unit: 30
    embeddings_batch_max_age_credit_work_units: 1000
    embeddings_batch_min_large_job_claim_interval_seconds: 30
    embeddings_batch_small_job_fast_lane_enabled: false
    embeddings_batch_small_job_max_work_units: 100
    embeddings_batch_finalization_first: true
    tier_policy_mode: disabled
    tier_policy_missing_service_mode: fail_open
    tier_policy_refresh_interval_seconds: 300
    tier_policy_refresh_jitter_seconds: 1
    tier_policy_transition_grace_seconds: 0.05
    tier_policy_refresh_retry_delay_seconds: 5
    tier_capacity_fair_share_enabled: false
    tier_capacity_fair_share_active_ttl_seconds: 10

s3:
  enabled: false
  bucket: ""
  region: us-east-1
  prefix: deltallm-logs/
  compression: ""
  accessKeyId: ""
  secretAccessKey: ""
  existingSecret:
    name: ""
    accessKeyIdKey: aws-access-key-id
    secretAccessKeyKey: aws-secret-access-key

prometheus:
  customMetrics:
    enabled: false # Externally managed Prometheus Adapter APIService.
  podAnnotations:
    enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

migrationJob:
  enabled: false
  external: false
  annotations: {}
  hook:
    enabled: false
    deletePolicy: before-hook-creation,hook-succeeded
  backoffLimit: 0
  activeDeadlineSeconds: 330
  timeoutSeconds: 300
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  command: [python, -m, src.prisma_bootstrap]
  args: [--schema, ./prisma/schema.prisma, --max-attempts, "30", --sleep-seconds, "2"]
  env: []
  envFrom: []

postgresql:
  enabled: false
  image:
    tag: latest
  auth:
    username: deltallm
    password: ""
    database: deltallm
  primary:
    persistence:
      enabled: true
      size: 10Gi

redis:
  enabled: false
  image:
    tag: latest
  auth:
    enabled: false
    password: ""
  master:
    persistence:
      enabled: true
      size: 5Gi

# Declared deployment ceilings, not a change to PostgreSQL/Redis server limits.
# Set these from provisioned service capacity before production deployment.
dependencyCapacity:
  apiProcessesPerPod: 1
  batchWorkerProcessesPerPod: 1
  accountingWorkerProcessesPerPod: 1
  accountingRequestProcessesPerPod: 1
  retiringGenerations: 1
  postgresqlMaxConnections: 1000
  postgresqlReservedConnections: 20
  redisMaxClients: 2000
  redisReservedClients: 64
  # Governed deployment allocations. Physical limits must be verified by operators.
  extended:
    enabled: false
    postgresqlMigrationConnections: 0
    postgresqlOtherConnections: 0
    redisOtherClients: 0
    proxyPoolsPerClient: 0
    auxiliaryHttpConnectionsPerProcess: 0
    cacheRedis:
      separate: false
      maxClients: 2000
      reservedClients: 64
    fileDescriptors:
      processLimit: 8192
      engineLimit: 1024
      inboundConnectionsPerProcess: 256
      otherPerProcess: 128
      headroomPerProcess: 256
      maxPodsPerNode: 44
      nodeLimit: 1048576
      nodeReserved: 8192
    providerDomains: {}
