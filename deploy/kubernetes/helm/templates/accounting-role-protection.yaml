{{- $native := eq .Values.config.general_settings.accounting_execution_mode "local_journal" -}}
{{- if $native -}}
{{- range $role := list "accountingWorker" "accountingRequest" -}}
{{- $values := get $.Values $role -}}
{{- if $values.enabled -}}
{{- $fullname := ternary "deltallm.accountingWorkerFullname" "deltallm.accountingRequestFullname" (eq $role "accountingWorker") -}}
{{- $labels := ternary "deltallm.accountingWorkerLabels" "deltallm.accountingRequestLabels" (eq $role "accountingWorker") -}}
{{- $selectors := ternary "deltallm.accountingWorkerSelectorLabels" "deltallm.accountingRequestSelectorLabels" (eq $role "accountingWorker") -}}
{{- if and $.Values.prometheus.serviceMonitor.enabled (eq $role "accountingWorker") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include $fullname $ }}
  labels:
    {{- include $labels $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
  selector:
    {{- include $selectors $ | nindent 4 }}
{{- end }}
{{- if $.Values.prometheus.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include $fullname $ }}
  labels:
    {{- include $labels $ | nindent 4 }}
    {{- with $.Values.prometheus.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if $.Values.prometheus.serviceMonitor.namespace }}
  namespace: {{ $.Values.prometheus.serviceMonitor.namespace }}
  {{- end }}
spec:
  {{- if and $.Values.prometheus.serviceMonitor.namespace (ne $.Values.prometheus.serviceMonitor.namespace $.Release.Namespace) }}
  namespaceSelector:
    matchNames: [{{ $.Release.Namespace }}]
  {{- end }}
  selector:
    matchLabels:
      {{- include $selectors $ | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.prometheus.serviceMonitor.interval }}
      scrapeTimeout: {{ $.Values.prometheus.serviceMonitor.scrapeTimeout }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: deltallm_role
{{- end }}
{{- if $.Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include $fullname $ }}
  labels:
    {{- include $labels $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include $selectors $ | nindent 6 }}
{{- end }}
{{- if $.Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include $fullname $ }}
  labels:
    {{- include $labels $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include $selectors $ | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if eq $role "accountingRequest" }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: batch-worker
      ports:
        - port: {{ $.Values.service.port }}
          protocol: TCP
    {{- end }}
    {{- with $.Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if $.Values.networkPolicy.allowDns }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with $.Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
