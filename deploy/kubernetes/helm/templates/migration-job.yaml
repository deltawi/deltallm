{{- if .Values.migrationJob.enabled }}
{{- $image := include "deltallm.image" . -}}
{{- $identity := printf "%s/%d/%s/%s/%s/%v" .Release.Name (int .Release.Revision) $image (toJson .Values.migrationJob.command) (toJson .Values.migrationJob.args) .Values.migrationJob.timeoutSeconds | sha256sum | trunc 12 -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "deltallm.fullname" . | trunc 40 | trimSuffix "-" }}-migrate-{{ $identity }}
  labels:
    {{- include "deltallm.labels" . | nindent 4 }}
  annotations:
    deltallm.ai/migration-image: {{ $image | quote }}
    {{- with .Values.migrationJob.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.migrationJob.hook.enabled }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: {{ .Values.migrationJob.hook.deletePolicy }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrationJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "deltallm.name" . | trunc 53 | trimSuffix "-" }}-migration
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            {{- toYaml .Values.migrationJob.command | nindent 12 }}
          args:
            {{- toYaml (concat .Values.migrationJob.args (list "--timeout-seconds" (toString .Values.migrationJob.timeoutSeconds))) | nindent 12 }}
          env:
            {{- include "deltallm.databaseEnv" . | nindent 12 }}
            {{- with .Values.migrationJob.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.migrationJob.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
