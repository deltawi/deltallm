{{- include "deltallm.validateSaturationScaling" . -}}
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "deltallm.fullname" . }}
  labels:
    {{- include "deltallm.labels" . | nindent 4 }}
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "deltallm.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.admittedInflight.enabled }}
    - type: Pods
      pods:
        metric:
          name: deltallm_admitted_inflight
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.admittedInflight.targetAverageValue | quote }}
    {{- end }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
