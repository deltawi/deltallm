{{- if .Values.accountingWorker.enabled }}
{{- include "deltallm.validateRouterStateSchemaCutover" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deltallm.accountingWorkerFullname" . }}
  labels:
    {{- include "deltallm.accountingWorkerLabels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  replicas: {{ .Values.accountingWorker.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "deltallm.accountingWorkerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deltallm.accountingWorkerSelectorLabels" . | nindent 8 }}
        {{- with .Values.accountingWorker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.dependencyCapacity.extended.enabled }}
        checksum/capacity: {{ include "deltallm.capacityReport" . | sha256sum }}
        {{- end }}
        checksum/config: {{ include "deltallm.accountingWorkerConfigYaml" . | sha256sum }}
        {{- if .Values.prometheus.podAnnotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.accountingWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "deltallm.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $priorityClassName := default .Values.priorityClassName .Values.accountingWorker.priorityClassName }}
      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $dependencyWaitInitContainers := include "deltallm.dependencyWaitInitContainers" . }}
      {{- if $dependencyWaitInitContainers -}}
{{ $dependencyWaitInitContainers | nindent 6 }}
      {{- end }}
      containers:
        - name: accounting-worker
          image: {{ include "deltallm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $command := default .Values.command .Values.accountingWorker.command }}
          {{- with $command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $args := default .Values.args .Values.accountingWorker.args }}
          {{- with $args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
{{ include "deltallm.runtimeEnv" (dict "root" . "extraEnv" .Values.accountingWorker.env "processes" .Values.dependencyCapacity.accountingWorkerProcessesPerPod "configTemplate" "deltallm.accountingWorkerConfigYaml") | indent 12 }}
          {{- $envFrom := include "deltallm.envFrom" (dict "root" . "extraEnvFrom" .Values.accountingWorker.envFrom) }}
          {{- if $envFrom -}}
{{ $envFrom | nindent 10 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.dependencyCapacity.extended.enabled }}
            - name: capacity
              mountPath: /app/capacity
              readOnly: true
            {{- end }}
            - name: scratch
              mountPath: /tmp
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.accountingWorker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- include "deltallm.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.accountingWorker.resources | nindent 12 }}
      volumes:
        {{- if .Values.dependencyCapacity.extended.enabled }}
        - name: capacity
          configMap:
            name: {{ include "deltallm.fullname" . }}-dependency-capacity
            items:
              - key: report.json
                path: report.json
        {{- end }}
        - name: scratch
          emptyDir:
            sizeLimit: 512Mi
        - name: config
          configMap:
            name: {{ include "deltallm.accountingWorkerFullname" . }}-config
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.accountingWorker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $nodeSelector := default .Values.nodeSelector .Values.accountingWorker.nodeSelector }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := default .Values.affinity .Values.accountingWorker.affinity }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $topology := default .Values.topologySpreadConstraints .Values.accountingWorker.topologySpreadConstraints }}
      {{- with $topology }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tolerations := default .Values.tolerations .Values.accountingWorker.tolerations }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
