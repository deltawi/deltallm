name: Accounting v2 acceptance

# Capacity, rollout and pod-loss acceptance on values-accounting-native.yaml,
# the accounting configuration production runs. See
# docs/deployment/accounting-v2-acceptance.md.
on:
  workflow_call:
    inputs:
      advisory:
        description: Report a failure on the job without failing the calling run
        type: boolean
        default: false
      pod_loss:
        description: >-
          Run the SIGKILL pod-loss step, which waits about 15 minutes for the
          killed pods' reservations to expire
        type: boolean
        default: true

permissions:
  contents: read

# `uv run` without a frozen lock re-checks uv.lock, which downloads the 400 MB
# en_core_web_lg wheel from github.com even though no CI lane installs it.
env:
  UV_FROZEN: "1"

jobs:
  native-cluster:
    runs-on: ubuntu-latest
    # Pull requests and main pushes call this as advisory: the job still shows its
    # red result, but it does not fail the CI run. The nightly run fails normally.
    continue-on-error: ${{ inputs.advisory }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        continue-on-error: true
        with:
          version: '0.9.28'
      - name: Install uv from PyPI if the GitHub download failed
        run: |
          command -v uv >/dev/null && exit 0
          python3 -m pip install --user --break-system-packages "uv==0.9.28"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Install frozen environment and generate client
        run: |
          uv sync --frozen --extra dev
          uv run prisma generate --schema=./prisma/schema.prisma
          uv run python scripts/check_container_contract.py
      - name: Build candidate image
        run: docker build --build-arg INSTALL_PRESIDIO=false -t deltallm-native:candidate .
      - name: Install pinned kind
        run: scripts/ci/install_kind.sh
      - name: Exercise fixed replicas, rollout and pod loss on accounting v2
        # Pull requests skip pod loss; pushes to main and the nightly run it.
        run: >-
          uv run python -m tests.performance.run_native_acceptance
          --image deltallm-native:candidate
          --kind /tmp/kind-linux-amd64
          --output /tmp/native-evidence/kubernetes
          ${{ !inputs.pod_loss && '--skip-pod-loss' || '' }}
      - name: Retain bounded accounting v2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accounting-v2-acceptance
          path: /tmp/native-evidence
          if-no-files-found: ignore
          retention-days: 30
