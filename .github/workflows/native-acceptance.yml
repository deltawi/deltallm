name: Accounting v2 acceptance

# Capacity, rollout and pod-loss acceptance on values-accounting-native.yaml,
# the accounting configuration production runs. See
# docs/deployment/accounting-v2-acceptance.md.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: '0.9.28'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Install frozen environment and generate client
        run: |
          uv sync --frozen --extra dev
          uv run prisma generate --schema=./prisma/schema.prisma
          uv run python scripts/check_container_contract.py
      - name: Build candidate image
        run: docker build --build-arg INSTALL_PRESIDIO=false -t deltallm-native:candidate .
      - name: Install pinned kind
        run: |
          curl -fsSL --max-time 90 https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64 -o /tmp/kind-linux-amd64
          curl -fsSL --max-time 90 https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64.sha256sum -o /tmp/kind.sha256sum
          (cd /tmp && sha256sum -c kind.sha256sum)
          chmod +x /tmp/kind-linux-amd64
      - name: Exercise fixed replicas, rollout and pod loss on accounting v2
        run: >-
          uv run python -m tests.performance.run_native_acceptance
          --image deltallm-native:candidate
          --kind /tmp/kind-linux-amd64
          --output /tmp/native-evidence/kubernetes
      - name: Retain bounded accounting v2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accounting-v2-acceptance
          path: /tmp/native-evidence
          if-no-files-found: ignore
          retention-days: 30
