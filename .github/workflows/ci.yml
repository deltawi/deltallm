name: CI

on:
  push:
    branches: [main, master, feature/org-tiers, feature/issue-304-model-router, feature/issue-320-concurrency]
  pull_request:
    branches: [main, master, feature/org-tiers, feature/issue-304-model-router, feature/issue-320-concurrency]

permissions:
  contents: read

# `uv run` without a frozen lock re-checks uv.lock, which downloads the 400 MB
# en_core_web_lg wheel from github.com even though no CI lane installs it.
env:
  UV_FROZEN: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Run UI unit tests
        run: npm run test:unit

      - name: Build UI
        run: npm run build

  python-tests:
    name: Python tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [hermetic, app]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        continue-on-error: true
        with:
          version: '0.9.28'
      - name: Install uv from PyPI if the GitHub download failed
        run: |
          command -v uv >/dev/null && exit 0
          python3 -m pip install --user --break-system-packages "uv==0.9.28"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Run ${{ matrix.lane }} tests
        # An explicit bash shell adds pipefail, so tee keeps pytest's exit code.
        shell: bash
        env:
          DELTALLM_MASTER_KEY: sk-test-master-key-for-ci-only-0000
          DELTALLM_SALT_KEY: ci-salt-key-for-testing-only-do-not-use-in-production
        run: >-
          uv run pytest -q -m "${{ matrix.lane }}"
          --durations=25 --durations-min=0.5
          | tee pytest-output.txt

      - name: Annotate failed tests
        if: failure()
        run: >-
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -n 50
          | sed 's/^/::error title=pytest::/' || true

  postgres-tests:
    name: Python tests (postgres ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        # Public service images do not need secrets, which fork PRs cannot read.
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deltallm_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        continue-on-error: true
        with:
          version: '0.9.28'
      - name: Install uv from PyPI if the GitHub download failed
        run: |
          command -v uv >/dev/null && exit 0
          python3 -m pip install --user --break-system-packages "uv==0.9.28"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Keep checkpoints out of the test run
        # A shard writes about 1 GB of WAL, the default max_wal_size. The forced
        # checkpoint then lands on the 250 ms billing tests and slow runner disks
        # push their commits past the budget. Commits still fsync as in production.
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U postgres -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET max_wal_size = '8GB'"
          -c "ALTER SYSTEM SET checkpoint_timeout = '30min'"
          -c "SELECT pg_reload_conf()"

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deltallm_test
        run: uv run prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Install isolated Realtime client
        run: |
          uv venv /tmp/deltallm-realtime-sdk
          uv pip sync --python /tmp/deltallm-realtime-sdk/bin/python tests/realtime/sdk-requirements.txt

      - name: Install isolated OpenAI SDK client
        run: |
          uv venv /tmp/deltallm-openai-sdk
          uv pip sync --python /tmp/deltallm-openai-sdk/bin/python tests/openai_sdk/requirements.txt

      - name: Run PostgreSQL tests
        # An explicit bash shell adds pipefail, so tee keeps pytest's exit code.
        shell: bash
        env:
          CI: 'true'
          DELTALLM_TEST_REDIS_URL: redis://localhost:6379/0
          DELTALLM_REALTIME_SDK_PYTHON: /tmp/deltallm-realtime-sdk/bin/python
          DELTALLM_OPENAI_SDK_PYTHON: /tmp/deltallm-openai-sdk/bin/python
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deltallm_test
          DELTALLM_MASTER_KEY: sk-test-master-key-for-ci-only-0000
          DELTALLM_SALT_KEY: ci-salt-key-for-testing-only-do-not-use-in-production
        run: >-
          uv run pytest -q -m postgres
          --postgres-shard=${{ matrix.shard }}/4
          --tb=short --durations=25 --durations-min=0.5
          | tee pytest-output.txt

      # The PostgreSQL service log is printed after the job and can push the
      # pytest summary out of the readable log, so failures also go to annotations.
      - name: Annotate failed tests
        if: failure()
        run: >-
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -n 50
          | sed 's/^/::error title=pytest::/' || true

  pgbouncer-tests:
    name: Python tests (PgBouncer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deltallm_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        continue-on-error: true
        with:
          version: '0.9.28'
      - name: Install uv from PyPI if the GitHub download failed
        run: |
          command -v uv >/dev/null && exit 0
          python3 -m pip install --user --break-system-packages "uv==0.9.28"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Install PgBouncer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          # The package starts its own service on port 6432; this job runs its own.
          sudo systemctl stop pgbouncer || true
          pgbouncer --version

      - name: Start PgBouncer with the generated aliases
        # The aliases come from the same generator that operators use. One more
        # alias has no connect_query, to prove that startup refuses it.
        env:
          DELTALLM_CONFIG_PATH: /tmp/pgbouncer-ci/config.yaml
          DELTALLM_DATABASE_POOLER_URL: postgresql://postgres:postgres@127.0.0.1:6432/deltallm_test_{allocation}
        run: |
          mkdir -p /tmp/pgbouncer-ci
          printf 'general_settings: {}\n' > /tmp/pgbouncer-ci/config.yaml
          uv run python -m src.db.runtime.pooler_config --host 127.0.0.1 --port 5432 \
            --dbname deltallm_test > /tmp/pgbouncer-ci/databases.ini
          echo 'deltallm_test_raw = host=127.0.0.1 port=5432 dbname=deltallm_test' \
            >> /tmp/pgbouncer-ci/databases.ini
          echo '"postgres" "postgres"' > /tmp/pgbouncer-ci/userlist.txt
          cat > /tmp/pgbouncer-ci/pgbouncer.ini <<'EOF'
          %include /tmp/pgbouncer-ci/databases.ini

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = md5
          auth_file = /tmp/pgbouncer-ci/userlist.txt
          pool_mode = transaction
          max_client_conn = 200
          default_pool_size = 2
          logfile = /tmp/pgbouncer-ci/pgbouncer.log
          pidfile = /tmp/pgbouncer-ci/pgbouncer.pid
          EOF
          cat /tmp/pgbouncer-ci/databases.ini
          pgbouncer -d /tmp/pgbouncer-ci/pgbouncer.ini

      - name: Run PgBouncer tests
        env:
          CI: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deltallm_test
          DELTALLM_TEST_PGBOUNCER_URL: postgresql://postgres:postgres@127.0.0.1:6432/deltallm_test_{allocation}
          DELTALLM_TEST_PGBOUNCER_REQUIRED: 'true'
        run: uv run pytest -q -m postgres -rs tests/test_database_pooler_postgres.py

      - name: Print the PgBouncer log
        if: failure()
        run: cat /tmp/pgbouncer-ci/pgbouncer.log || true

  redis-tests:
    name: Python tests (redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      redis-critical-memory:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379
      redis-cache-memory:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6381:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        continue-on-error: true
        with:
          version: '0.9.28'
      - name: Install uv from PyPI if the GitHub download failed
        run: |
          command -v uv >/dev/null && exit 0
          python3 -m pip install --user --break-system-packages "uv==0.9.28"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Run Redis tests
        env:
          REDIS_URL: redis://localhost:6379/0
          DELTALLM_TEST_REDIS_URL: redis://localhost:6379/0
          DELTALLM_TEST_REDIS_CRITICAL_MEMORY_URL: redis://localhost:6380/0
          DELTALLM_TEST_REDIS_CACHE_MEMORY_URL: redis://localhost:6381/0
        run: >-
          uv run pytest -q -m redis -rs
          --durations=25 --durations-min=0.5

  migration-paths:
    name: PostgreSQL migration paths
    needs: cluster-changes
    if: needs.cluster-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deltallm_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        continue-on-error: true
        with:
          version: '0.9.28'
      - name: Install uv from PyPI if the GitHub download failed
        run: |
          command -v uv >/dev/null && exit 0
          python3 -m pip install --user --break-system-packages "uv==0.9.28"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Fetch pinned shared-feature migration commit
        # The commit is kept only by refs/pull/286/head, which a full clone does not fetch.
        run: git fetch --no-tags origin 3372602bf7bff6107ee9595217b7f2fd75da61cd

      - name: Verify fresh and last-release migration paths
        env:
          MIGRATION_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run python scripts/verify_migration_paths.py

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        continue-on-error: true
        with:
          version: '0.9.28'
      - name: Install uv from PyPI if the GitHub download failed
        run: |
          command -v uv >/dev/null && exit 0
          python3 -m pip install --user --break-system-packages "uv==0.9.28"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Validate chart
        run: |
          set -euo pipefail

          VALID_MASTER_KEY=sk-ci-validation-1234567890abcdeA1
          VALID_SALT_KEY=ci-validation-salt-0123456789abcdef0123456789abcdef
          VALID_DATABASE_URL=postgresql://deltallm:deltallm@postgres:5432/deltallm
          VALID_REDIS_URL=redis://redis:6379/0

          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build deploy/kubernetes/helm
          helm lint deploy/kubernetes/helm \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}"
          helm template deltallm deploy/kubernetes/helm \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            > /dev/null
          helm lint deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-eval.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}"
          helm template deltallm deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-eval.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            > /dev/null
          helm lint deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-production.yaml \
            -f deploy/kubernetes/helm/values-production-strict.yaml \
            -f deploy/kubernetes/helm/values-capacity-fixture.yaml \
            --set image.tag=ci-validation \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            --set runtime.database.url="${VALID_DATABASE_URL}" \
            --set runtime.redis.url="${VALID_REDIS_URL}"
          helm template deltallm deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-production.yaml \
            -f deploy/kubernetes/helm/values-production-strict.yaml \
            -f deploy/kubernetes/helm/values-capacity-fixture.yaml \
            --set image.tag=ci-validation \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            --set runtime.database.url="${VALID_DATABASE_URL}" \
            --set runtime.redis.url="${VALID_REDIS_URL}" \
            > /dev/null
          for replicas in 2 3 4; do
            helm lint deploy/kubernetes/helm \
              -f deploy/kubernetes/helm/values-production.yaml \
              -f deploy/kubernetes/helm/values-production-strict.yaml \
              -f deploy/kubernetes/helm/values-capacity-experiment.yaml \
              -f deploy/kubernetes/helm/values-capacity-fixture.yaml \
              --set replicaCount="$replicas" \
              --set image.tag=ci-validation \
              --set secret.values.masterKey="${VALID_MASTER_KEY}" \
              --set secret.values.saltKey="${VALID_SALT_KEY}" \
              --set runtime.database.url="${VALID_DATABASE_URL}" \
              --set runtime.redis.url="${VALID_REDIS_URL}"
            helm template deltallm deploy/kubernetes/helm \
              -f deploy/kubernetes/helm/values-production.yaml \
              -f deploy/kubernetes/helm/values-production-strict.yaml \
              -f deploy/kubernetes/helm/values-capacity-experiment.yaml \
              -f deploy/kubernetes/helm/values-capacity-fixture.yaml \
              --set replicaCount="$replicas" \
              --set image.tag=ci-validation \
              --set secret.values.masterKey="${VALID_MASTER_KEY}" \
              --set secret.values.saltKey="${VALID_SALT_KEY}" \
              --set runtime.database.url="${VALID_DATABASE_URL}" \
              --set runtime.redis.url="${VALID_REDIS_URL}" \
              > /dev/null
          done

      - name: Verify effective profile documentation
        run: uv run python scripts/render_capacity_profiles.py --check

      - name: Run Helm tests
        run: >-
          uv run pytest -q -m helm -rs
          --durations=25 --durations-min=0.5

  # Pull requests that change only the UI or documentation skip the kind cluster
  # jobs, and pull requests that do not touch the schema or its tooling skip the
  # migration paths. Pushes to main and every other change run everything.
  cluster-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.diff.outputs.runtime }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Choose the cluster and migration checks for this change
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || [ -z "$BASE" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE...HEAD")"
          printf 'Changed files:\n%s\n' "$changed"
          # Anything outside the UI, the docs and repository text runs the clusters.
          ui_or_docs='^(ui/|docs/|mkdocs\.yml$|[^/]+\.md$|\.github/(dependabot\.yml|pull_request_template\.md|workflows/docs\.yml)$)'
          if printf '%s\n' "$changed" | grep -qvE "$ui_or_docs"; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi
          schema='^(prisma/|src/(migration_process\.py|migration_recovery/|prisma_bootstrap\.py|organization_deletion_migrations\.py|db/runtime/migration_status\.py)|scripts/(verify_migration_paths\.py|migration_fixtures/)|pyproject\.toml$|uv\.lock$|Dockerfile$|\.github/workflows/ci\.yml$)'
          if printf '%s\n' "$changed" | grep -qE "$schema"; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  lifecycle-acceptance:
    needs: cluster-changes
    if: needs.cluster-changes.outputs.runtime == 'true'
    uses: ./.github/workflows/lifecycle-acceptance.yml

  capacity-acceptance:
    needs: cluster-changes
    if: needs.cluster-changes.outputs.runtime == 'true'
    uses: ./.github/workflows/capacity-acceptance.yml

  accounting-v2-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Run accounting v2 acceptance when billing, batch or database code changes
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(src/(billing|batch|db|metrics|bootstrap)/|src/api/internal_accounting\.py$|src/config\.py$|prisma/|deploy/kubernetes/helm/|tests/performance/|Dockerfile$|uv\.lock$|\.github/workflows/native-acceptance\.yml$)'
          if git diff --name-only "$BASE...HEAD" | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Advisory until it is green on main: not part of the required `test` job, and a
  # failure shows on the job without turning the whole CI run red.
  accounting-v2-acceptance:
    needs: accounting-v2-changes
    if: needs.accounting-v2-changes.outputs.run == 'true'
    uses: ./.github/workflows/native-acceptance.yml
    with:
      advisory: true
      # Pod loss waits about 15 minutes for reservation expiry; pull requests
      # skip it, pushes to main and the nightly soak run it.
      pod_loss: ${{ github.event_name != 'pull_request' }}

  test:
    name: test
    if: ${{ always() }}
    needs: [python-tests, postgres-tests, pgbouncer-tests, redis-tests, cluster-changes, migration-paths, helm, lifecycle-acceptance, capacity-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all Python test lanes passed
        env:
          APP_AND_HERMETIC: ${{ needs.python-tests.result }}
          POSTGRES: ${{ needs.postgres-tests.result }}
          PGBOUNCER: ${{ needs.pgbouncer-tests.result }}
          REDIS: ${{ needs.redis-tests.result }}
          CHANGES: ${{ needs.cluster-changes.result }}
          MIGRATIONS: ${{ needs.migration-paths.result }}
          HELM: ${{ needs.helm.result }}
          LIFECYCLE: ${{ needs.lifecycle-acceptance.result }}
          CAPACITY: ${{ needs.capacity-acceptance.result }}
          RUN_RUNTIME: ${{ needs.cluster-changes.outputs.runtime }}
          RUN_MIGRATIONS: ${{ needs.cluster-changes.outputs.migrations }}
        run: |
          for result in "$APP_AND_HERMETIC" "$POSTGRES" "$PGBOUNCER" "$REDIS" "$CHANGES" "$HELM"; do
            if [ "$result" != success ]; then
              echo "Required test job finished with status: $result"
              exit 1
            fi
          done
          # A filtered job may be skipped only when the change filter chose to skip it.
          check_filtered() {
            if [ "$2" = success ] || { [ "$3" = false ] && [ "$2" = skipped ]; }; then
              return 0
            fi
            echo "Required test job $1 finished with status: $2 (filter: $3)"
            exit 1
          }
          check_filtered migration-paths "$MIGRATIONS" "$RUN_MIGRATIONS"
          check_filtered lifecycle-acceptance "$LIFECYCLE" "$RUN_RUNTIME"
          check_filtered capacity-acceptance "$CAPACITY" "$RUN_RUNTIME"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        continue-on-error: true
        with:
          version: '0.9.28'
      - name: Install uv from PyPI if the GitHub download failed
        run: |
          command -v uv >/dev/null && exit 0
          python3 -m pip install --user --break-system-packages "uv==0.9.28"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run linter
        run: uv run ruff check .
