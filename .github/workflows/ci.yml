name: CI

on:
  push:
    branches: [main, master, feature/org-tiers, feature/issue-304-model-router]
  pull_request:
    branches: [main, master, feature/org-tiers, feature/issue-304-model-router]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Run UI unit tests
        run: npm run test:unit

      - name: Build UI
        run: npm run build

  python-tests:
    name: Python tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [hermetic, app]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Run ${{ matrix.lane }} tests
        env:
          DELTALLM_MASTER_KEY: sk-test-master-key-for-ci-only-0000
          DELTALLM_SALT_KEY: ci-salt-key-for-testing-only-do-not-use-in-production
        run: >-
          uv run pytest -q -m "${{ matrix.lane }}"
          --durations=25 --durations-min=0.5

  postgres-tests:
    name: Python tests (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deltallm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deltallm_test
        run: uv run prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Run PostgreSQL tests
        env:
          CI: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deltallm_test
          DELTALLM_MASTER_KEY: sk-test-master-key-for-ci-only-0000
          DELTALLM_SALT_KEY: ci-salt-key-for-testing-only-do-not-use-in-production
        run: >-
          uv run pytest -q -m postgres
          --durations=25 --durations-min=0.5

  redis-tests:
    name: Python tests (redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Run Redis tests
        env:
          REDIS_URL: redis://localhost:6379/0
          DELTALLM_TEST_REDIS_URL: redis://localhost:6379/0
        run: >-
          uv run pytest -q -m redis -rs
          --durations=25 --durations-min=0.5

  migration-paths:
    name: PostgreSQL migration paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deltallm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Verify fresh and last-release migration paths
        env:
          MIGRATION_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run python scripts/verify_migration_paths.py

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Validate chart
        run: |
          set -euo pipefail

          VALID_MASTER_KEY=sk-ci-validation-1234567890abcdeA1
          VALID_SALT_KEY=ci-validation-salt-0123456789abcdef0123456789abcdef
          VALID_DATABASE_URL=postgresql://deltallm:deltallm@postgres:5432/deltallm
          VALID_REDIS_URL=redis://redis:6379/0

          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build deploy/kubernetes/helm
          helm lint deploy/kubernetes/helm \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}"
          helm template deltallm deploy/kubernetes/helm \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            > /dev/null
          helm lint deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-eval.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}"
          helm template deltallm deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-eval.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            > /dev/null
          helm lint deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-production.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            --set runtime.database.url="${VALID_DATABASE_URL}" \
            --set runtime.redis.url="${VALID_REDIS_URL}"
          helm template deltallm deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-production.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            --set runtime.database.url="${VALID_DATABASE_URL}" \
            --set runtime.redis.url="${VALID_REDIS_URL}" \
            > /dev/null

      - name: Run Helm tests
        run: >-
          uv run pytest -q -m helm -rs
          --durations=25 --durations-min=0.5

  test:
    name: test
    if: ${{ always() }}
    needs: [python-tests, postgres-tests, redis-tests, migration-paths, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all Python test lanes passed
        env:
          APP_AND_HERMETIC: ${{ needs.python-tests.result }}
          POSTGRES: ${{ needs.postgres-tests.result }}
          REDIS: ${{ needs.redis-tests.result }}
          MIGRATIONS: ${{ needs.migration-paths.result }}
          HELM: ${{ needs.helm.result }}
        run: |
          for result in "$APP_AND_HERMETIC" "$POSTGRES" "$REDIS" "$MIGRATIONS" "$HELM"; do
            if [ "$result" != success ]; then
              echo "Required test job finished with status: $result"
              exit 1
            fi
          done

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run linter
        run: uv run ruff check .
