name: CI

on:
  push:
    branches: [main, master, feature/org-tiers]
  pull_request:
    branches: [main, master, feature/org-tiers]

jobs:
  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deltallm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=./prisma/schema.prisma

      - name: Verify fresh and last-release migration paths
        env:
          MIGRATION_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run python scripts/verify_migration_paths.py --base-ref v0.1.34

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deltallm_test
        run: uv run prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Run tier admission against real Redis
        env:
          DELTALLM_TEST_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -v -rs tests/services/test_tier_fair_share_redis_integration.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deltallm_test
          REDIS_URL: redis://localhost:6379/0
          DELTALLM_MASTER_KEY: sk-test-master-key-for-ci-only-0000
          DELTALLM_SALT_KEY: ci-salt-key-for-testing-only-do-not-use-in-production
        run: uv run pytest -v --ignore=tests/test_provider_presets_smoke.py

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate chart
        run: |
          set -euo pipefail

          VALID_MASTER_KEY=sk-ci-validation-1234567890abcdeA1
          VALID_SALT_KEY=ci-validation-salt-0123456789abcdef0123456789abcdef
          VALID_DATABASE_URL=postgresql://deltallm:deltallm@postgres:5432/deltallm
          VALID_REDIS_URL=redis://redis:6379/0

          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build deploy/kubernetes/helm
          helm lint deploy/kubernetes/helm \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}"
          helm template deltallm deploy/kubernetes/helm \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            > /dev/null
          helm lint deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-eval.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}"
          helm template deltallm deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-eval.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            > /dev/null
          helm lint deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-production.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            --set runtime.database.url="${VALID_DATABASE_URL}" \
            --set runtime.redis.url="${VALID_REDIS_URL}"
          helm template deltallm deploy/kubernetes/helm \
            -f deploy/kubernetes/helm/values-production.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            --set runtime.database.url="${VALID_DATABASE_URL}" \
            --set runtime.redis.url="${VALID_REDIS_URL}" \
            > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linter
        run: uv run ruff check .
