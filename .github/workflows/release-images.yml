name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  docker:
    uses: ./.github/workflows/lifecycle-acceptance.yml
    permissions:
      contents: read
    with:
      publish-release: true
    secrets: inherit

  # Sign the exact digests that passed acceptance and were tagged. Keyless: the
  # certificate names this workflow and the release tag, so no signing key exists.
  sign-images:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: docker.io/deltallm/deltallm
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qualified-release-digest-*
          path: /tmp/release-digests
          merge-multiple: true

      - name: Read qualified digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          for variant in false true; do
            digest=$(cat "/tmp/release-digests/$variant")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            name=standard
            if [ "$variant" = true ]; then name=presidio; fi
            echo "${name}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign release images
        env:
          STANDARD_DIGEST: ${{ steps.digests.outputs.standard }}
          PRESIDIO_DIGEST: ${{ steps.digests.outputs.presidio }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_NAME}@${STANDARD_DIGEST}"
          cosign sign --yes "${IMAGE_NAME}@${PRESIDIO_DIGEST}"

      - name: Attest build provenance (standard image)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.standard }}

      - name: Attest build provenance (Presidio image)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.presidio }}

  helm-repo:
    needs: [docker, sign-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      CHART_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      CHART_SOURCE_DIR: deploy/kubernetes/helm

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Derive chart release metadata
        shell: bash
        run: |
          set -euo pipefail

          chart_version="${RELEASE_TAG#v}"
          if [[ ! "$chart_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' must look like v0.1.12 or v0.1.12-rc.1"
            exit 1
          fi

          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build "${CHART_SOURCE_DIR}"

      - name: Prepare versioned chart package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/deltallm-chart /tmp/deltallm-packages
          mkdir -p /tmp/deltallm-chart /tmp/deltallm-packages
          cp -R "${CHART_SOURCE_DIR}/." /tmp/deltallm-chart/

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          chart_path = Path("/tmp/deltallm-chart/Chart.yaml")
          values_path = Path("/tmp/deltallm-chart/values.yaml")
          chart_version = os.environ["CHART_VERSION"]
          release_tag = os.environ["RELEASE_TAG"]

          chart_text = chart_path.read_text()
          chart_text = re.sub(r"(?m)^version:\s*.*$", f"version: {chart_version}", chart_text, count=1)
          chart_text = re.sub(r'(?m)^appVersion:\s*.*$', f'appVersion: "{release_tag}"', chart_text, count=1)
          chart_path.write_text(chart_text)

          values_text = values_path.read_text()
          values_text = re.sub(r'(?m)^  tag:\s*.*$', f'  tag: "{release_tag}"', values_text, count=1)
          values_path.write_text(values_text)
          PY

      - name: Validate packaged chart
        run: |
          VALID_MASTER_KEY=sk-release-validation-1234567890abcdeA1
          VALID_SALT_KEY=release-validation-salt-0123456789abcdef0123456789abcdef
          VALID_DATABASE_URL=postgresql://deltallm:deltallm@postgres:5432/deltallm
          VALID_REDIS_URL=redis://redis:6379/0

          helm lint /tmp/deltallm-chart \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}"
          helm template deltallm /tmp/deltallm-chart \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            > /dev/null
          helm lint /tmp/deltallm-chart \
            -f /tmp/deltallm-chart/values-eval.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}"
          helm template deltallm /tmp/deltallm-chart \
            -f /tmp/deltallm-chart/values-eval.yaml \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            > /dev/null
          helm lint /tmp/deltallm-chart \
            -f /tmp/deltallm-chart/values-production.yaml \
            -f /tmp/deltallm-chart/values-capacity-fixture.yaml \
            --set image.tag="${RELEASE_TAG}" \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            --set runtime.database.url="${VALID_DATABASE_URL}" \
            --set runtime.redis.url="${VALID_REDIS_URL}"
          helm template deltallm /tmp/deltallm-chart \
            -f /tmp/deltallm-chart/values-production.yaml \
            -f /tmp/deltallm-chart/values-capacity-fixture.yaml \
            --set image.tag="${RELEASE_TAG}" \
            --set secret.values.masterKey="${VALID_MASTER_KEY}" \
            --set secret.values.saltKey="${VALID_SALT_KEY}" \
            --set runtime.database.url="${VALID_DATABASE_URL}" \
            --set runtime.redis.url="${VALID_REDIS_URL}" \
            > /dev/null

      - name: Package chart
        run: helm package /tmp/deltallm-chart --destination /tmp/deltallm-packages

      - name: Attest chart package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: /tmp/deltallm-packages/deltallm-${{ env.CHART_VERSION }}.tgz

      - name: Publish chart repository to gh-pages
        shell: bash
        env:
          GH_PAGES_DIR: /tmp/deltallm-gh-pages
          SOURCE_CHART_DIR: /tmp/deltallm-chart
          SOURCE_VALUES_DIR: ${{ github.workspace }}/deploy/kubernetes/helm
        run: |
          set -euo pipefail

          rm -rf "${GH_PAGES_DIR}"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "${GH_PAGES_DIR}" origin/gh-pages
            cd "${GH_PAGES_DIR}"
            git switch -c gh-pages --track origin/gh-pages || git switch gh-pages
          else
            git worktree add -b gh-pages "${GH_PAGES_DIR}" HEAD
            cd "${GH_PAGES_DIR}"
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          cp "/tmp/deltallm-packages/deltallm-${CHART_VERSION}.tgz" .
          cp "${SOURCE_VALUES_DIR}/values.yaml" .
          cp "${SOURCE_VALUES_DIR}/values-eval.yaml" .
          cp "${SOURCE_VALUES_DIR}/values-production.yaml" .
          cp "${SOURCE_CHART_DIR}/values.yaml" "values-${CHART_VERSION}.yaml"
          cp "${SOURCE_VALUES_DIR}/values-eval.yaml" "values-eval-${CHART_VERSION}.yaml"
          cp "${SOURCE_VALUES_DIR}/values-production.yaml" "values-production-${CHART_VERSION}.yaml"

          if [[ -f index.yaml ]]; then
            helm repo index . --url "${CHART_REPO_URL}" --merge index.yaml
          else
            helm repo index . --url "${CHART_REPO_URL}"
          fi

          cat > index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>DeltaLLM Helm Repository</title>
          </head>
          <body>
            <h1>DeltaLLM Helm Repository</h1>
            <p>Add this repository with:</p>
            <pre><code>helm repo add deltallm ${CHART_REPO_URL}
          helm repo update</code></pre>
            <p>Quick-start evaluation install with bundled PostgreSQL and Redis:</p>
            <pre><code>helm install deltallm deltallm/deltallm \\
          --version ${CHART_VERSION} \\
          -f ${CHART_REPO_URL}/values-eval-${CHART_VERSION}.yaml</code></pre>
            <p>Release-matched values overlays:</p>
            <ul>
              <li><a href="values-eval-${CHART_VERSION}.yaml">values-eval-${CHART_VERSION}.yaml</a></li>
              <li><a href="values-production-${CHART_VERSION}.yaml">values-production-${CHART_VERSION}.yaml</a></li>
              <li><a href="values-${CHART_VERSION}.yaml">values-${CHART_VERSION}.yaml</a></li>
            </ul>
            <p>See the main project docs for deployment examples.</p>
          </body>
          </html>
          EOF

          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .nojekyll \
            index.html \
            index.yaml \
            "deltallm-${CHART_VERSION}.tgz" \
            values.yaml \
            values-eval.yaml \
            values-production.yaml \
            "values-${CHART_VERSION}.yaml" \
            "values-eval-${CHART_VERSION}.yaml" \
            "values-production-${CHART_VERSION}.yaml"
          if git diff --cached --quiet; then
            echo "No chart repo changes to publish"
            exit 0
          fi
          git commit -m "Publish Helm chart ${CHART_VERSION}"
          git push origin gh-pages

  railway-template:
    runs-on: ubuntu-latest
    needs: [docker, sign-images, helm-repo]
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TEMPLATE_ID: ${{ vars.RAILWAY_TEMPLATE_ID }}
      RAILWAY_TEMPLATE_WORKSPACE: ${{ vars.RAILWAY_TEMPLATE_WORKSPACE }}
      RAILWAY_TEMPLATE_DEMO_PROJECT: ${{ vars.RAILWAY_TEMPLATE_DEMO_PROJECT }}
      RAILWAY_TEMPLATE_README: deploy/railway/template.md

    steps:
      - name: Check Railway template publishing config
        id: railway-template-config
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RAILWAY_API_TOKEN}" || -z "${RAILWAY_TEMPLATE_ID}" ]]; then
            echo "::notice::Skipping Railway template publish. Configure secrets.RAILWAY_API_TOKEN and vars.RAILWAY_TEMPLATE_ID to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.railway-template-config.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Railway CLI
        if: steps.railway-template-config.outputs.enabled == 'true'
        run: npm install -g @railway/cli@5.70.0

      - name: Publish Railway template metadata
        if: steps.railway-template-config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          args=(
            templates publish "${RAILWAY_TEMPLATE_ID}"
            --category "AI/ML"
            --description "Deploy DeltaLLM with managed PostgreSQL and Redis on Railway."
            --readme-file "${RAILWAY_TEMPLATE_README}"
            --json
          )

          if [[ -n "${RAILWAY_TEMPLATE_WORKSPACE}" ]]; then
            args+=(--workspace "${RAILWAY_TEMPLATE_WORKSPACE}")
          fi

          if [[ -n "${RAILWAY_TEMPLATE_DEMO_PROJECT}" ]]; then
            args+=(--demo-project "${RAILWAY_TEMPLATE_DEMO_PROJECT}")
          fi

          railway "${args[@]}"
