# Keeps the SHA-pinned GitHub Actions current. Dependabot rewrites both the
# commit SHA and the trailing "# vX.Y.Z" comment in one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Propose a release only after it has been public for a week, so a
    # compromised version is usually pulled before it reaches this repo.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    # Major versions can change inputs or artifact formats; upgrade them by hand.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # The pinned official OpenAI SDK used by the compatibility tests. The nightly
  # workflow already tests the newest release; this keeps the pull request pin close.
  - package-ecosystem: pip
    directory: /tests/openai_sdk
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      openai-sdk:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
