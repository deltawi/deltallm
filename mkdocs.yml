site_name: DeltaLLM Documentation
site_description: Open-source LLM gateway with unified API, RBAC, guardrails, and observability
site_url: https://docs.deltallm.io/
repo_url: https://github.com/deltawi/deltallm
repo_name: deltallm

# Internal plans live beside the public sources for repository-local review, but
# they must never be rendered, indexed, or included in the public sitemap.
exclude_docs: |
  internal/

theme:
  name: material
  # Reuse the UI's built-in assets so the product and docs have one brand source.
  custom_dir: ui/public
  logo: brand/deltallm-delta.svg
  favicon: favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
  - attr_list
  - def_list

extra_css:
  - stylesheets/brand.css

