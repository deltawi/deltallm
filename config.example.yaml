# DeltaLLM starter configuration
#
# This file is intentionally opinionated:
# - the active settings are the minimum recommended local/dev setup
# - advanced features stay commented until you need them
# - secrets should come from environment variables, not hardcoded values
#
# Quick path:
# 1. Copy this file to config.yaml
# 2. Set the required environment variables from docs/getting-started/docker.md
# 3. Start DeltaLLM and verify /v1/models
# 4. After the first successful seed, you can set
#    general_settings.model_deployment_bootstrap_from_config: false
#    and manage deployments from the Admin UI or API

model_list:
  # Sample deployment used by the quickstart docs.
  # Keep this if you want to bootstrap one OpenAI-backed chat model on first start.
  - model_name: gpt-4o-mini
    deltallm_params:
      provider: openai
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      api_base: https://api.openai.com/v1
      timeout: 60
      # Optional async Batch API chat execution control.
      # Missing chat_batching behaves like mode: concurrent.
      # For vLLM, concurrent is usually preferred because vLLM batches inside the engine.
      # chat_batching:
      #   mode: concurrent
      #   max_in_flight: 32
      # Use sync_microbatch only with a provider adapter that returns per-item results and usage.
      # chat_batching:
      #   mode: sync_microbatch
      #   upstream_max_batch_size: 8
      #   max_total_input_tokens: 32000
      #   # false is not supported until a provider adapter defines safe heterogeneous grouping.
      #   require_homogeneous_params: true

router_settings:
  # Simple defaults are best for a first setup.
  routing_strategy: simple-shuffle
  num_retries: 0
  retry_after: 1
  timeout: 600
  cooldown_time: 60
  allowed_fails: 0
  # Set route-group workload mode explicitly. Older files that omit it infer one common
  # enabled-member mode (or chat when no member mode can be resolved) and log a warning.
  # route_groups:
  #   - key: search-embeddings
  #     mode: embedding
  #     strategy: weighted
  #     context:
  #       mode: smallest-sufficient
  #       unknown_capacity: allow
  #       safety_margin_tokens: 256
  #     members:
  #       - deployment_id: embeddings-primary
  #         weight: 3
  #       - deployment_id: embeddings-secondary
  #         weight: 1

general_settings:
  instance_name: DeltaLLM
  # Installation-wide UI branding. Logo and favicon BLOBs are managed from Settings > Theme.
  ui_branding:
    primary_color: "#5B50D6"
    secondary_color: "#8B7CFF"
    menu_hover_color: "#F7F5FF"

  # Required secrets
  master_key: os.environ/DELTALLM_MASTER_KEY
  salt_key: os.environ/DELTALLM_SALT_KEY

  # Database and Redis
  # In Docker Compose, DATABASE_URL and REDIS_URL are wired automatically.
  database_url: os.environ/DATABASE_URL
  redis_url: os.environ/REDIS_URL
  db_pool_size: 20
  db_pool_timeout: 30
  # Reject overload before prompt, guardrail, and budget work. Enable after sizing
  # these limits below the measured safe database/upstream concurrency envelope.
  gateway_preflight_capacity_enabled: false
  gateway_preflight_global_max_parallel: 300
  gateway_preflight_org_max_parallel: 100
  gateway_preflight_lease_ttl_seconds: 30
  # The outbox mode durably accepts one small event on the request path and
  # applies idempotent spend/ledger updates in a bounded background worker.
  spend_ingestion_mode: legacy
  spend_ingestion_batch_size: 100
  spend_ingestion_flush_interval_ms: 100
  spend_ingestion_lease_seconds: 30
  spend_ingestion_max_attempts: 10
  spend_ingestion_worker_enabled: true
  spend_ingestion_max_pending_events: 100000
  spend_ingestion_overload_policy: sync_fallback
  spend_ingestion_fallback_max_concurrency: 1
  spend_ingestion_fallback_max_waiters: 8
  spend_ingestion_fallback_queue_timeout_ms: 100
  spend_ingestion_fallback_execution_timeout_seconds: 2
  spend_ingestion_completed_retention_hours: 1
  spend_ingestion_failed_retention_days: 30
  spend_ingestion_cleanup_interval_seconds: 60
  spend_ingestion_cleanup_batch_size: 1000
  spend_ingestion_cleanup_max_batches_per_run: 10
  spend_ingestion_cleanup_time_budget_seconds: 2
  telemetry_db_pool_size: 5
  telemetry_db_pool_timeout_seconds: 2
  telemetry_worker_startup_timeout_seconds: 5
  telemetry_shutdown_drain_timeout_seconds: 20
  audit_ingestion_mode: legacy
  audit_ingestion_worker_enabled: true
  audit_ingestion_batch_size: 100
  audit_ingestion_flush_interval_ms: 100
  audit_ingestion_lease_seconds: 30
  audit_ingestion_max_attempts: 10
  audit_ingestion_max_pending_events: 100000
  audit_ingestion_required_reserve: 10000
  audit_ingestion_completed_retention_hours: 1
  audit_ingestion_failed_retention_days: 30
  audit_ingestion_cleanup_interval_seconds: 60
  audit_ingestion_cleanup_batch_size: 1000
  audit_ingestion_cleanup_max_batches_per_run: 10
  audit_ingestion_cleanup_time_budget_seconds: 2
  budget_enforcement_query_timeout_seconds: 2
  # Reserve database capacity for gateway traffic by bounding expensive UI reports locally
  # and across every API worker connected to the same PostgreSQL database.
  spend_reporting_max_concurrency: 2
  spend_reporting_global_max_concurrency: 2
  spend_reporting_queue_timeout_seconds: 10
  spend_reporting_execution_timeout_seconds: 60
  spend_reporting_redis_timeout_seconds: 0.5
  # Enable only after the reporting-v2 database check passes and every gateway
  # and batch worker runs the reporting-v2 writer.
  spend_reporting_v2_enabled: false

  # Upstream provider HTTP pool tuning. These are startup-time settings;
  # restart the process or roll the Kubernetes deployment after changing them.
  # For Kubernetes, multiply upstream_http_max_connections by workers per pod and pod count
  # when checking provider, NAT gateway, and file descriptor limits.
  upstream_http_connect_timeout_seconds: 10
  upstream_http_read_timeout_seconds: 300
  upstream_http_write_timeout_seconds: 30
  upstream_http_pool_timeout_seconds: 10
  upstream_http_max_connections: 500
  upstream_http_max_keepalive_connections: 100
  upstream_http_keepalive_expiry_seconds: 60

  # Admin session login
  # Set these only if you want an initial browser-login admin account created on boot.
  platform_bootstrap_admin_email: os.environ/PLATFORM_BOOTSTRAP_ADMIN_EMAIL
  platform_bootstrap_admin_password: os.environ/PLATFORM_BOOTSTRAP_ADMIN_PASSWORD
  auth_session_ttl_hours: 12

  # Recommended startup path:
  # - db_only: manage deployments from the Admin UI or API
  # - bootstrap_from_config: true so the sample model seeds on first boot
  #   After the first successful seed, set this back to false for steady-state use.
  model_deployment_source: db_only
  model_deployment_bootstrap_from_config: true

  # Optional performance and auth-cache tuning
  api_key_auth_cache_ttl_seconds: 300
  # Organization deletion immediately revokes tenant access, cancels pending
  # work, waits through a recovery window, then purges bounded pages.
  organization_lifecycle_auth_max_staleness_seconds: 3
  organization_lifecycle_auth_cache_max_entries: 10000
  organization_deletion_recovery_window_hours: 168
  organization_deletion_max_attempts: 20
  # Enable only after every API and worker replica reports the backend's current
  # lifecycle protocol version (v2 for this rollout).
  organization_deletion_requests_enabled: false
  organization_deletion_worker_enabled: true
  organization_deletion_worker_poll_interval_seconds: 5
  organization_deletion_worker_batch_size: 5
  organization_deletion_worker_max_concurrency: 2
  organization_deletion_worker_lease_seconds: 60
  organization_deletion_worker_record_timeout_seconds: 45
  organization_deletion_worker_page_size: 100
  organization_deletion_worker_max_pages_per_claim: 10
  organization_deletion_waiting_poll_seconds: 10
  organization_deletion_retry_initial_seconds: 5
  organization_deletion_retry_max_seconds: 300
  cache_enabled: false
  cache_backend: memory
  cache_ttl: 3600
  cache_max_size: 10000
  # Organization tier policy compiles into an in-memory snapshot. Enforcement is staged.
  tier_policy_mode: disabled
  tier_policy_missing_service_mode: fail_open
  tier_policy_refresh_interval_seconds: 300
  tier_policy_refresh_jitter_seconds: 1
  tier_policy_transition_grace_seconds: 0.05
  tier_policy_refresh_retry_delay_seconds: 5
  tier_capacity_fair_share_enabled: false
  tier_capacity_fair_share_active_ttl_seconds: 10

  # Governance notifications are opt-in and disabled by default.
  governance_notifications_enabled: false
  budget_notifications_enabled: false
  key_lifecycle_notifications_enabled: false
  budget_alert_ttl_seconds: 3600

  # Optional terminal Batch API webhooks. The feature remains inert until enabled.
  # Generate the encryption key with:
  #   python -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())'
  # Keep the key in an environment secret; it encrypts callback URLs and signing secrets at rest.
  batch_webhook_enabled: false
  batch_webhook_worker_enabled: true
  batch_webhook_observability_enabled: true
  batch_webhook_encryption_key: os.environ/DELTALLM_BATCH_WEBHOOK_ENCRYPTION_KEY
  batch_webhook_poll_interval_seconds: 1
  batch_webhook_observability_refresh_interval_seconds: 15
  batch_webhook_max_concurrency: 4
  batch_webhook_lease_seconds: 30
  batch_webhook_timeout_seconds: 10
  batch_webhook_max_attempts: 8
  batch_webhook_retry_initial_seconds: 5
  batch_webhook_retry_max_seconds: 3600
  batch_webhook_allowed_ports:
    - 443
  batch_webhook_allowed_private_cidrs: []
  batch_webhook_allow_http: false
  batch_webhook_delivery_retention_days: 30
  batch_webhook_cleanup_max_rows_per_run: 10000

  # Email delivery is optional.
  # Enable this when you want invitations, password reset, test email, or governance notifications.
  # For local/dev, point SMTP at Mailpit/MailHog.
  # For production, use smtp, resend, or sendgrid with real credentials.
  # email_base_url must be the public app origin when email is enabled.
  #
  # email_enabled: true
  # email_provider: smtp
  # email_from_address: no-reply@example.com
  # email_reply_to: support@example.com
  # email_base_url: http://localhost:4002
  # email_worker_enabled: true
  # email_worker_batch_size: 10
  # email_worker_max_concurrency: 3
  # email_worker_delivery_lease_seconds: 60
  # email_worker_audit_lease_seconds: 30
  # email_worker_startup_timeout_seconds: 5
  # email_worker_shutdown_drain_timeout_seconds: 20
  # email_max_attempts: 5
  # email_retry_initial_seconds: 60
  # email_retry_max_seconds: 3600
  #
  # SMTP example
  # smtp_host: localhost
  # smtp_port: 1025
  # smtp_username: null
  # smtp_password: null
  # smtp_use_tls: false
  #
  # Resend example
  # email_provider: resend
  # resend_api_key: os.environ/RESEND_API_KEY
  #
  # SendGrid example
  # email_provider: sendgrid
  # sendgrid_api_key: os.environ/SENDGRID_API_KEY

  # SSO is optional.
  # Enable this only after Redis is configured because SSO callback state is stored server-side.
  # DeltaLLM keeps SSO disabled if Redis-backed state storage is unavailable.
  #
  # enable_sso: true
  # sso_provider: oidc
  # sso_client_id: os.environ/SSO_CLIENT_ID
  # sso_client_secret: os.environ/SSO_CLIENT_SECRET
  # sso_authorize_url: https://idp.example.com/oauth2/authorize
  # sso_token_url: https://idp.example.com/oauth2/token
  # sso_userinfo_url: https://idp.example.com/oauth2/userinfo
  # sso_redirect_uri: http://localhost:4002/auth/callback
  # sso_scope: openid email profile
  # sso_admin_email_list:
  #   - admin@example.com
  # sso_default_team_id: team-123
  # sso_state_ttl_seconds: 600
  #
  # Optional self-service developer sandbox onboarding for first-time SSO users.
  # Defaults are applied only when the account is first provisioned; admins can
  # edit the seeded org, team, memberships, budgets, and limits later.
  #
  # self_registration:
  #   enabled: true
  #   mode: sso_allowed_domain
  #   allowed_domains:
  #     - example.com
  #   require_email_verification: true
  #   require_admin_approval: false
  #   default_org:
  #     id: org-sandbox
  #     name: Developer Sandbox
  #     max_budget: 100
  #     soft_budget: 80
  #     rpm_limit: 300
  #     tpm_limit: 500000
  #     rph_limit: 2000
  #     rpd_limit: 10000
  #     tpd_limit: 5000000
  #   default_team:
  #     id: team-self-serve
  #     alias: Self-Service Developers
  #     role: team_developer
  #     max_budget: 50
  #     soft_budget: 40
  #     rpm_limit: 150
  #     tpm_limit: 250000
  #     rph_limit: 1000
  #     rpd_limit: 5000
  #     tpd_limit: 2500000
  #     self_service_keys_enabled: true
  #     self_service_max_keys_per_user: 2
  #     self_service_budget_ceiling: 5
  #     self_service_require_expiry: true
  #     self_service_max_expiry_days: 14
  #   default_user:
  #     max_budget: 10
  #     soft_budget: 8
  #     rpm_limit: 30
  #     tpm_limit: 50000
  #     rph_limit: 200
  #     rpd_limit: 1000
  #     tpd_limit: 500000

  # Optional JWT bearer authentication for proxy requests.
  #
  # enable_jwt_auth: true
  # jwt_public_key_url: https://idp.example.com/.well-known/jwks.json
  # jwt_audience: deltallm
  # jwt_issuer: https://idp.example.com/

  # Optional health checks and observability
  #
  # background_health_checks: true
  # health_check_interval: 300
  # health_check_model: gpt-4o-mini
  # prometheus_endpoint: /metrics
  # metrics_retention_days: 30
  # Prompt resolution caches both hits and misses to keep the request path off SQL.
  # prompt_negative_cache_enabled: false
  # prompt_cache_l1_ttl_seconds: 30
  # prompt_cache_l2_ttl_seconds: 300
  # prompt_negative_l1_ttl_seconds: 5
  # prompt_negative_l2_ttl_seconds: 30
  # prompt_cache_l1_max_entries: 10000
  # prompt_singleflight_max_keys: 256
  # prompt_singleflight_timeout_seconds: 2
  # Prompt render metadata uses the policy-aware audit ingress. Outbox mode
  # accepts the required record through the isolated telemetry pool.
  # Start with shadow, verify zero mismatches, then switch to combined.
  # budget_enforcement_query_mode: legacy
  # budget_enforcement_shadow_sample_rate: 0.01

deltallm_settings:
  # Keep callback and guardrail config minimal in the starter file.
  # Request, token, spend, cache, and latency metrics are emitted natively.
  # Configure callbacks only for external sinks or custom integrations.
  success_callback: []
  failure_callback: []
  turn_off_message_logging: false

  # Optional S3 callback target for request logs or exports.
  #
  # callback_settings:
  #   s3:
  #     bucket: os.environ/DELTALLM_S3_BUCKET
  #     region: us-east-1
  #     prefix: deltallm-logs/

  # Optional built-in guardrail examples.
  # Uncomment these only after their provider-specific dependencies are configured.
  #
  # guardrails:
  #   - guardrail_name: presidio-pii
  #     deltallm_params:
  #       guardrail: src.guardrails.presidio.PresidioGuardrail
  #       mode: pre_call
  #       default_on: true
  #       default_action: block
  #       anonymize: true
  #       threshold: 0.5
  #       entities:
  #         - EMAIL_ADDRESS
  #         - PHONE_NUMBER
  #         - US_SSN
  #   - guardrail_name: lakera-prompt-injection
  #     deltallm_params:
  #       guardrail: src.guardrails.lakera.LakeraGuardrail
  #       mode: pre_call
  #       default_on: true
  #       default_action: block
  #       api_key: os.environ/LAKERA_API_KEY
  #       threshold: 0.5
  #       fail_open: false
